<form (ngSubmit)="onSubmit()" #f="ngForm" class="userForm" novalidate>
    <div class="field">
        <label for="user">Full name <span class="req">*</span></label>
        <input placeholder="e.g. Jane Cooper" type="text" name="name" id="user" ngModel required maxlength="60"
            autocomplete="off" pInputText>
        <small class="errorMessage" *ngIf="f.form.controls['name']?.touched && f.form.controls['name'].errors?.['required']">
            Name is required.
        </small>
    </div>

    <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input placeholder="jane@example.com" type="email" name="email" id="email" email ngModel required
            (input)="duplicateEmail = false" autocomplete="off" pInputText>
        <small class="errorMessage" *ngIf="f.form.controls['email']?.touched">
            <ng-container *ngIf="f.form.controls['email'].errors?.['required']">Email is required.</ng-container>
            <ng-container *ngIf="f.form.controls['email'].errors?.['email']">Enter a valid email address.</ng-container>
        </small>
        <small class="errorMessage" *ngIf="duplicateEmail">A customer with this email already exists.</small>
    </div>

    <div class="field">
        <label for="phone">Phone (with country code) <span class="req">*</span></label>
        <div class="phoneInput">
            <span>+</span>
            <input placeholder="6591234567" type="tel" inputmode="numeric" name="phone" id="phone" ngModel required
                minlength="7" maxlength="15" pattern="[0-9]*" autocomplete="off" pInputText>
        </div>
        <small class="errorMessage" *ngIf="f.form.controls['phone']?.touched">
            <ng-container *ngIf="f.form.controls['phone'].errors?.['required']">Phone number is required.</ng-container>
            <ng-container *ngIf="f.form.controls['phone'].errors?.['pattern']">Use digits only.</ng-container>
            <ng-container *ngIf="f.form.controls['phone'].errors?.['minlength']">Use at least 7 digits.</ng-container>
        </small>
    </div>

    <div class="row" ngModelGroup="location">
        <div class="field">
            <label for="city">City</label>
            <input placeholder="City" type="text" name="city" id="city" ngModel maxlength="40" pInputText>
        </div>
        <div class="field">
            <label for="country">Country</label>
            <input placeholder="Country" type="text" name="country" id="country" ngModel maxlength="40" pInputText>
        </div>
    </div>

    <div class="field">
        <label for="avatar">Photo URL</label>
        <input placeholder="https://…" type="url" name="avatar" id="avatar" ngModel pattern="https?://.+" pInputText>
        <small class="errorMessage" *ngIf="f.form.controls['avatar']?.touched && f.form.controls['avatar'].errors?.['pattern']">
            Use a full link starting with http:// or https://
        </small>
        <small class="hint" *ngIf="!f.form.controls['avatar']?.errors">Optional. Initials are shown when there's no photo.</small>
    </div>

    <div class="formActions">
        <button (click)="clearForm()" class="btn btn-ghost" type="button">Clear</button>
        <button [disabled]="f.form.status!=='VALID'" class="btn btn-primary" type="submit">Add customer</button>
    </div>
</form>
