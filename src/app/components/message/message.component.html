<p *ngIf="message" class="message {{type}}" [ngClass]="{'toast': !fullParentWidth}"
   [attr.role]="type === 'error' ? 'alert' : 'status'">
    <i class="pi" [ngClass]="type === 'error' ? 'pi-exclamation-circle' : 'pi-check-circle'"></i>
    <span class="text">{{message}}</span>
    <button type="button" (click)="clearMessage()" aria-label="Dismiss message"><i class="pi pi-times"></i></button>
</p>
