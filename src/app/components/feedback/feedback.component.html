<section class="fbView" *ngIf="feedback">
    <div class="fbHead">
        <h3>Feedback</h3>
        <span class="date" *ngIf="feedback.date">{{feedback.date | date:'mediumDate'}}</span>
    </div>

    <dl class="facts">
        <div>
            <dt>Satisfaction</dt>
            <dd><span class="mood" [ngClass]="mood">{{feedback.satisfactory}}</span></dd>
        </div>
        <div>
            <dt>Overall rating</dt>
            <dd class="ratingRow">
                <p-rating [ngModel]="feedback.rating" [readonly]="true" [cancel]="false"></p-rating>
                <span>{{feedback.rating}}/5</span>
            </dd>
        </div>
        <div>
            <dt>Best service</dt>
            <dd>{{feedback.services}}</dd>
        </div>
        <div>
            <dt>Follows us on</dt>
            <dd>
                <span *ngIf="!feedback.social?.length" class="muted">No social channels</span>
                <span class="chip" *ngFor="let s of feedback.social">{{s}}</span>
            </dd>
        </div>
    </dl>

    <blockquote *ngIf="feedback.reason">“{{feedback.reason}}”</blockquote>
</section>
