<form (ngSubmit)="onSubmit()" #feedback="ngForm" class="fbForm">

    <h3 class="formTitle">Record feedback</h3>

    <fieldset class="question">
        <legend>1. How satisfied is {{name || 'the customer'}} with our services? <span class="req">*</span></legend>
        <div class="choiceGrid">
            <div *ngFor="let item of satisStats" class="choice">
                <p-radioButton [inputId]="item.id" name="satisfactory" [value]="item.name" ngModel required></p-radioButton>
                <label [for]="item.id">{{item.name}}</label>
            </div>
        </div>
    </fieldset>

    <fieldset class="question">
        <legend>2. Overall experience <span class="req">*</span></legend>
        <p-rating name="rating" ngModel [cancel]="false" required></p-rating>
    </fieldset>

    <fieldset class="question">
        <legend>3. Which of our services is the best? <span class="req">*</span></legend>
        <p-dropdown placeholder="Select a service" [options]="services" name="services" optionValue="name"
            ngModel optionLabel="name" [required]="true" styleClass="fullWidth" appendTo="body"></p-dropdown>
        <textarea required placeholder="Why do they think it's the best?" class="tArea" name="reason" ngModel
            maxlength="300" rows="3" aria-label="Why it is the best service"></textarea>
    </fieldset>

    <fieldset class="question">
        <legend>4. Which of our social channels do they follow?</legend>
        <div class="choiceGrid">
            <div class="choice" *ngFor="let s of socials">
                <p-checkbox name="social" [value]="s.name" [inputId]="s.id" [(ngModel)]="followedSocials"></p-checkbox>
                <label class="socialName" [for]="s.id">{{s.name}}</label>
            </div>
        </div>
    </fieldset>

    <div class="formActions">
        <button type="button" (click)="clearForm()" class="btn btn-ghost">Clear</button>
        <button class="btn btn-primary" [disabled]="feedback.form.status!=='VALID'" type="submit">
            Save feedback
        </button>
    </div>

</form>
